inherit: [autotools, patch]

metaEnvironment:
    PKG_VERSION: "2.45"
    PKG_LICENSE: "FSFAP AND GFDL-1.3 AND GPL-2.0-or-later AND LGPL-2.0-or-later"

checkoutSCM:
    scm: url
    url: ${GNU_MIRROR}/binutils/binutils-${PKG_VERSION}.tar.xz
    digestSHA1: "09fd8a50a95be4a94412fe3847d16280996679c5"
    stripComponents: 1

checkoutDeterministic: True
checkoutScript: |
    patchApplySeries $<@binutils/*.patch@>

# Some parts are compiled for the host during compilation. Hence we need the
# host toolchain too.
buildTools: [host-toolchain, bison]
buildToolsWeak: [m4]
multiPackage:
    "":
        Config:
            BINUTILS_TARGETS_BFD:
                type: str
                help: "Additional targets the BFD library should support. To include
                       support for all known targets, use all."
            BINUTILS_ENABLE_64BIT_BFD:
                type: bool
                default: false
                help: "Include support for 64 bit targets. This is automatically
                       turned on if you explicitly request a 64 bit target, but not
                       for --enable-targets=all."

        buildVars: [AUTOCONF_HOST, AUTOCONF_TARGET, BINUTILS_PREFIX,
                    BINUTILS_TARGETS_BFD, BINUTILS_ENABLE_64BIT_BFD]
        buildScript: |
            export MAKEINFO=true
            autotoolsBuild -o MAKEINFO=true -O MAKEINFO=true $1 \
                ${BINUTILS_PREFIX:+--prefix=${BINUTILS_PREFIX}} \
                --with-sysroot=${BINUTILS_PREFIX:-/usr}/sysroots/${AUTOCONF_TARGET:-${AUTOCONF_HOST:-$AUTOCONF_BUILD}} \
                --enable-deterministic-archives \
                --enable-default-hash-style=gnu \
                --disable-nls \
                --disable-werror \
                --enable-plugins \
                --enable-lto \
                ${BINUTILS_TARGETS_BFD:+--enable-targets=${BINUTILS_TARGETS_BFD}} \
                $( [ $BINUTILS_ENABLE_64BIT_BFD ] && echo "--enable-64-bit-bfd" || echo "" ) \

        multiPackage:
            dev:
                packageScript: |
                    autotoolsPackageDev
            "":
                packageScript: |
                    autotoolsPackageTgt

                    # make sure that prefixed versions are available on native build
                    if [[ ${AUTOCONF_HOST:-$AUTOCONF_BUILD} = ${AUTOCONF_TARGET:-${AUTOCONF_HOST:-$AUTOCONF_BUILD}} ]]
                    then
                        pushd ./${BINUTILS_PREFIX:-/usr}/bin
                        for i in *; do
                            ln -s "$i" "${AUTOCONF_HOST:-$AUTOCONF_BUILD}-$i"
                        done
                        popd
                    fi

                provideTools:
                    binutils: usr/bin

    libiberty:
        depends:
            - devel::binutils-dev
        buildScript: |
            autotoolsBuild $1/libiberty \
                --enable-install-libiberty
            if [[ -e install/usr/lib64 ]]; then
                mkdir -p install/usr/lib
                mv install/usr/lib64/* install/usr/lib
            fi
        multiPackage:
            dev:
                packageScript: autotoolsPackageDev
            tgt:
                packageScript: autotoolsPackageTgt
